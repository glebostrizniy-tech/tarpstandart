name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        # Ставим только сайт и его зависимости, без api-server.
        run: pnpm install --frozen-lockfile --filter @workspace/tarpstandart...

      - name: Build frontend
        working-directory: artifacts/tarpstandart
        env:
          PORT: "5173"
          # Пока сайт на github.io/tarpstandart — нужен подпуть.
          # Когда повесишь tarpstandart.ru в корень Pages — смени на "/".
          BASE_PATH: "/tarpstandart/"
          VITE_SITE_URL: "https://glebostrizniy-tech.github.io/tarpstandart"
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: pnpm run build

      - name: Verify build output
        run: |
          test -f artifacts/tarpstandart/dist/public/index.html
          rm -f artifacts/tarpstandart/dist/public/CNAME
          ls -la artifacts/tarpstandart/dist/public | head

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/tarpstandart/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
